<!-- =========================== ОКНО: ИЗМЕРЕНИЕ (2 точки) ======================== -->
<div class="bl-win" id="win-measure" data-ws="gen" data-label="Измерение">
  <div class="bl-win-head"><svg class="ic ic-14"><use href="#i-measure"/></svg><span class="title">Измерение (2 точки)</span><span class="x" data-close>✕</span></div>
  <div class="bl-win-body">
    <button class="cnc-btn" id="measure-btn">Включить измерение</button>
    <button class="cnc-btn" id="measure-clear">Сбросить</button>
    <div id="measure-info">ЛКМ по модели — точка 1, затем точка 2. Esc — сброс.</div>
    <div class="cnc-hint">Инструмент активен, пока кнопка подсвечена: два клика задают отрезок, длина выводится в 3D-виде и здесь.</div>
  </div>
</div>
