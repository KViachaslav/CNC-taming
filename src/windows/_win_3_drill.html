<!-- ========================= ОКНО: СВЕРЛОВКА (drill.nc) ========================= -->
<div class="bl-win" id="win-drill" data-ws="gen" data-label="Сверловка">
  <div class="bl-win-head"><svg class="ic ic-14"><use href="#i-gizmo"/></svg><span class="title">ЧПУ — сверловка (Holes)</span><span class="x" data-close>✕</span></div>
  <div class="bl-win-body">
    <div class="cnc-row"><label>Мин. диаметр (мм)</label><input type="number" id="drill-min-d" value="0.3" step="0.1" min="0"></div>
    <div class="cnc-row"><label>Макс. диаметр (мм)</label><input type="number" id="drill-max-d" value="10" step="0.1" min="0"></div>
    <div class="cnc-row"><label>Безопасная Z (мм)</label><input type="number" id="drill-safe-z" value="5" step="0.5"></div>
    <div class="cnc-row"><label>Z сверления (мм)</label><input type="number" id="drill-depth" value="-2" step="0.1"></div>
    <div class="cnc-row"><label>Подача врезания</label><input type="number" id="drill-plunge-feed" value="100" step="10"></div>
    <div class="cnc-row"><label>Обороты шпинделя (об/мин)</label><input type="number" id="drill-spindle" value="1000" step="100" min="0"></div>
    <div class="cnc-row"><label>Ускоренный ход G0 (мм/мин)</label><input type="number" id="drill-rapid-feed" value="3000" step="100" min="1"></div>
    <div class="cnc-row"><label>Смена инструмента (сек)</label><input type="number" id="drill-tool-change" value="0" step="5" min="0"></div>
    <div class="cnc-row"><label>Пауза на дне (сек)</label><input type="number" id="drill-dwell" value="0.3" step="0.1" min="0"></div>
    <div class="cnc-row"><label>Режим</label>
      <select id="drill-mode">
        <option value="peck">Peck (G83)</option>
        <option value="simple">Простое (G81)</option>
      </select>
    </div>
    <div class="cnc-row"><label>Peck шаг (мм)</label><input type="number" id="drill-peck" value="1" step="0.1" min="0.1"></div>
    <div class="cnc-row"><label><input type="checkbox" id="drill-invert-y"> Инвертировать Y</label></div>
    <div class="cnc-row"><label><input type="checkbox" id="drill-mirror-x"> Отразить по X (зеркало, центр платы)</label></div>
    <div class="cnc-row"><label><input type="checkbox" id="drill-only-visible" checked> Только видимые слои</label></div>
    <div class="cnc-row"><label><input type="checkbox" id="drill-show-marks" checked> Показывать точки</label></div>
    <div class="cnc-row"><label><input type="checkbox" id="drill-merge-layer-dups" checked> Дедуплицировать площадки</label></div>
    <button class="cnc-btn" id="drill-generate">Сгенерировать сверловку</button>
    <button class="cnc-btn" id="drill-download" disabled>Скачать drill.nc</button>
    <div id="drill-info"></div>
    <div id="drill-tools"></div>
  </div>
</div>
